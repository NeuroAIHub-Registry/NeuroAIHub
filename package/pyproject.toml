[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaihub"
version = "1.1.0"
description = "NeuroAIHub: AI-driven discovery of neuroradiology datasets — chat agent and curated dataset database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC BY-NC-ND 4.0" }
dependencies = [
    "openai>=1.40,<2",
    "pandas>=1.5.3,<3",
    "numpy>=1.24,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["ipython"]

[tool.setuptools.packages.find]
include = ["neuroaihub*"]

[tool.setuptools.package-data]
neuroaihub = ["data/*.csv"]

[project.urls]
Homepage = "https://github.com/NeuroAIHub-Registry/NeuroAIHub"
Website = "https://neuroai.streamlit.app/"
Paper = "https://www.ajnr.org/content/early/2026/04/24/ajnr.A9363"
